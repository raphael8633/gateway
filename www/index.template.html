  <footer>raphtools.com</footer>

  <script>
    // Best-effort service status indicator. Endpoint is optional; if missing
    // (or auth-gated), dots simply stay grey.
    fetch('/services-status.json', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data || !data.services) return;
        document.querySelectorAll('.status-dot[data-path]').forEach(dot => {
          const entry = data.services[dot.dataset.path];
          if (!entry) return;
          dot.dataset.state = entry.state;
          dot.title = entry.state + (entry.checked_at ? ' · ' + entry.checked_at : '');
        });
      })
      .catch(() => { /* silently keep dots grey */ });
  </script>
